name: Update prices
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 05:30 Bangkok, Tue-Sat (after the US close)
    - cron: "30 4 * * 1-5"    # 11:30 Bangkok, catches late data
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: python scripts/update_quotes.py
      - name: Commit if changed
        run: |
          git diff --quiet quotes.json && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "Update prices $(date -u +%F)"
          git push
